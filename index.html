<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Notes — A Literature Series</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0e14;--ink:#e8ecf2;--muted:#8a96a8;--faint:#566175;--gold:#f4c95d;--card:#111824;--card2:#0d121b;--edge:#1f2a3a}
  :root[data-theme="light"]{--bg:#f7f8fa;--ink:#1a1f28;--muted:#4a5666;--faint:#7a8696;--gold:#b8860b;--card:#ffffff;--card2:#eef1f5;--edge:#e2e6ec}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1000px 700px at 80% -5%,rgba(244,201,93,0.07),transparent 60%),var(--bg);
    color:var(--ink);font-family:'Sora',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
  header{max-width:900px;margin:0 auto;padding:90px 24px 30px;text-align:center}
  .kicker{font-family:'Space Mono',monospace;letter-spacing:0.4em;text-transform:uppercase;font-size:11px;color:var(--gold);margin-bottom:20px}
  h1{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(2.4rem,6vw,4.2rem);line-height:1;letter-spacing:-0.02em;margin-bottom:16px}
  h1 em{font-style:italic;color:var(--gold)}
  header p{color:var(--muted);font-weight:300;max-width:560px;margin:0 auto;font-size:1.05rem}
  main{max-width:1080px;margin:40px auto 90px;padding:0 24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{position:relative;display:block;color:inherit;background:linear-gradient(180deg,var(--card),var(--card2));
    border:1px solid var(--edge);border-radius:16px;padding:22px 22px 20px;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
  .card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 18px 40px rgba(0,0,0,0.5)}
  .card .stretch{position:absolute;inset:0;z-index:1;border-radius:16px}
  .card .date{font-family:'Space Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:0.1em}
  .card h2{font-family:'Fraunces',serif;font-weight:600;font-size:1.35rem;line-height:1.15;margin:8px 0 10px}
  .card p{color:var(--muted);font-size:13.5px;font-weight:300}
  .card .pdf{position:relative;z-index:2;display:inline-flex;align-items:center;gap:6px;margin-top:12px;
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.06em;color:var(--gold);text-decoration:none;
    border:1px solid var(--edge);border-radius:30px;padding:6px 12px;transition:border-color .2s ease,background .2s ease}
  .card .pdf:hover{border-color:var(--gold);background:rgba(244,201,93,0.08)}
  .card .tags{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
  .card .tags span{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.05em;color:var(--gold);
    border:1px solid var(--edge);border-radius:30px;padding:3px 9px}
  .empty{color:var(--faint);text-align:center;padding:60px 0;font-family:'Space Mono',monospace}
  footer{text-align:center;padding:0 20px 60px;color:var(--faint);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.1em}
  .theme-toggle{position:fixed;top:16px;right:16px;z-index:50;width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;line-height:1;
    background:var(--card);color:var(--gold);border:1px solid var(--edge);transition:border-color .2s ease,transform .2s ease}
  .theme-toggle:hover{border-color:var(--gold);transform:translateY(-2px)}
</style>
<script>
  // Apply the saved theme before first paint to avoid a flash of the wrong colors.
  (function(){ try{ if(localStorage.getItem('theme')==='light'){ document.documentElement.setAttribute('data-theme','light'); } }catch(e){} })();
</script>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light/dark theme">☀</button>
<header>
  <div class="kicker">A Literature Series</div>
  <h1>Research <em>Notes</em></h1>
  <p>Interactive explainers and visuals on different research topics.</p>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No entries yet — add one to <code>posts.json</code>.</div>
</main>
<footer>BUILT AS STATIC HTML · HOSTED ON GITHUB PAGES</footer>

<script>
  // The homepage is "data-driven": it reads posts.json and renders one card per
  // entry. To publish a new chapter I only ever touch posts.json — never this file.
  // The fetch path is RELATIVE, so it resolves correctly on both user and project sites.
  fetch('posts.json')
    .then(r => r.json())
    .then(posts => {
      posts.sort((a, b) => a.date < b.date ? 1 : -1); // newest first
      const grid = document.getElementById('grid');
      if (!posts.length) { document.getElementById('empty').style.display = 'block'; return; }
      grid.innerHTML = posts.map(p => `
        <div class="card">
          <a class="stretch" href="posts/${p.slug}/" aria-label="Open: ${p.title}"></a>
          <span class="date">${p.date}</span>
          <h2>${p.title}</h2>
          <p>${p.blurb}</p>
          ${p.pdf ? `<a class="pdf" href="${p.pdf}" target="_blank" rel="noopener">📄 Download PDF</a>` : ''}
          <div class="tags">${(p.tags || []).map(t => `<span>${t}</span>`).join('')}</div>
        </div>`).join('');
    })
    .catch(() => { document.getElementById('empty').style.display = 'block'; });
</script>
<script>
  // Theme toggle. The choice is stored in localStorage under 'theme' and shared
  // with every post (series-nav.js reads the same key), so it persists site-wide.
  (function(){
    var btn = document.getElementById('themeToggle');
    function sync(){ btn.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? '☾' : '☀'; }
    sync();
    btn.addEventListener('click', function(){
      var light = document.documentElement.getAttribute('data-theme') === 'light';
      if (light) { document.documentElement.removeAttribute('data-theme'); }
      else { document.documentElement.setAttribute('data-theme', 'light'); }
      try { localStorage.setItem('theme', light ? 'dark' : 'light'); } catch(e){}
      sync();
    });
  })();
</script>
</body>
</html>
